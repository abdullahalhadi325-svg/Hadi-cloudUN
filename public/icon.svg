<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background with safe padding for maskable mode -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Cloud Icon Body -->
  <path d="M384 320a72 72 0 0 0 16-142.2 112 112 0 0 0-218.4-23.4A80 80 0 0 0 112 320h272z" 
        fill="url(#cloudGrad)" opacity="0.95" />
        
  <!-- Core Shield / Enclave in Cloud Center -->
  <path d="M256 220v140c42-20 70-56 70-96v-44l-70-28-70 28v44c0 40 28 76 70 96z" 
        fill="url(#shieldGrad)" opacity="0.9" />
  
  <!-- Subtle Glass Highlight Arc -->
  <path d="M180 180a90 90 0 0 1 150-15" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.4" />
</svg>
